[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nso-room-server"
version = "1.26.41"
description = "Standalone asyncio room relay for Ninja School Offline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nso-room-server = "nso_server.cli:main"

[tool.setuptools.packages.find]
include = ["nso_server*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
